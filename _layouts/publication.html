---
layout: default
sec: publications
---

<h1>{{ page.title }}</h1>
<div class="subtitle">
    {% if page.authors %}{% include author_list.html authors=page.authors %}.<br>{% endif %}
    {{ page.conf }}, updated {{ page.date | date: "%e %B %Y"}}.
</div>

<p>
    Most recent version: <a href="{{ page.link }}" target="_blank">{{ page.link }}</a>.
</p>

<h2>Abstract</h2>
<div class="abstract">
    {{ page.content}}
</div>
